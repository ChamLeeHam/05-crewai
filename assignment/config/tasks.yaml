research_task:
  description: >
    对"{topic}"进行全面深入的研究。
    请完成以下工作：
    1. 使用搜索新闻工具查找关于"{topic}"的最新新闻报道
    2. 使用获取统计数据工具收集相关的市场数据和统计信息
    3. 整理收集到的信息，提取关键要点
    研究报告应包含：
    - 最新动态：3-5条重要新闻摘要
    - 关键数据：相关的统计数据和市场信息
    - 趋势分析：基于收集的信息分析发展趋势
  expected_output: >
    一份结构化的研究报告，包含：
    1. 新闻摘要（3-5条）
    2. 关键统计数据
    3. 趋势分析要点

  agent: researcher

writing_task:
  description: >
    基于研究员提供的资料，撰写一篇关于"{topic}"的深度报告。
    文章要求：
    1. 标题要吸引人，能准确反映文章主题
    2. 开头要有引人入胜的导语，点明文章价值
    3. 正文分3-4个小节，每节有小标题
    4. 适当引用数据支撑观点
    5. 结尾要有总结和展望
    6. 总字数控制在500-800字
    写作风格：
    - 专业但不晦涩
    - 客观中立，避免主观臆断
    - 逻辑清晰，层次分明
  expected_output: >
    一篇500-800字的深度报告文章，包含标题、导语、正文（分小节）和结
    尾。
  agent: writer

editing_task:
  description: >
    对撰写员提交的文章进行专业编辑和优化。
    编辑工作包括：
    1. 检查文章结构是否清晰合理
    2. 检查数据引用是否准确
    3. 优化标题和小标题，使其更吸引人
    4. 修改语句，使表达更加流畅
    5. 确保文章风格统一，无错别字
    6. 添加必要的格式（如使用 Markdown）
    输出要求：
    - 提供编辑后的完整文章
    - 使用 Markdown 格式
    - 确保可以直接发布
  expected_output: >
    编辑优化后的完整文章，使用Markdown格式，可直接发布。
  agent: editor
  output_file: output\news_report.md